version: '3.8'

# Network isolation for security
networks:
  garage_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  postgres:
    image: postgres:16-alpine
    container_name: garage_postgres
    environment:
      POSTGRES_USER: garage_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garage_secure_password_2024}
      POSTGRES_DB: garage_master
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    networks:
      - garage_network
    # Security: run as non-root
    user: postgres
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Prevent log files from growing too large
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # pgBouncer for connection pooling
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: garage_pgbouncer
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_DATABASE: garage_master
      DATABASES_USER: garage_admin
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD:-garage_secure_password_2024}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      SERVER_IDLE_TIMEOUT: 600
      SERVER_LIFETIME: 3600
    ports:
      - "127.0.0.1:6432:6432"
    restart: unless-stopped
    networks:
      - garage_network
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: garage_redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - garage_network
    # Security: require password
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    container_name: garage_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-garage_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garage_backend
    environment:
      DATABASE_URL: postgresql://garage_admin:${POSTGRES_PASSWORD:-garage_secure_password_2024}@postgres:5432/garage_master?schema=public&connection_limit=20&pool_timeout=30
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_2024}@redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: garage_minio
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-garage_minio_secure_password_2024}
      MINIO_BUCKET: garage-files
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (min 32 chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env (min 32 chars)}
      PORT: 8080
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      CUSTOMER_CORS_ORIGIN: ${CUSTOMER_CORS_ORIGIN:-http://localhost:3001}
      MECHANIC_CORS_ORIGIN: ${MECHANIC_CORS_ORIGIN:-http://localhost:3002}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - garage_network
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    # Security: read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp
    # Health check for backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: garage_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./admin_frontend/build/web:/usr/share/nginx/html/admin
      - ./customer_frontend:/usr/share/nginx/html/customer
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: garage_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: garage_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set in .env}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
