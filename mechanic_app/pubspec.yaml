name: auto_renew_mechanic
description: "Auto Renew - Mechanic App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  http: ^1.2.0
  socket_io_client: ^2.0.3
  firebase_messaging: ^15.1.3
  firebase_core: ^3.8.0
  go_router: ^14.6.1
  flutter_screenutil: ^5.9.3
  table_calendar: ^3.1.2
  animate_do: ^3.3.4
  lottie: ^3.2.0
  glassmorphism: ^3.0.0
  particles_network: ^1.0.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  flutter_slidable: ^4.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/launcher_icon.png
