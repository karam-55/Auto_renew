name: garage_go_mechanic
description: Garage Go 2.0 Mechanic App - Flutter Mobile
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Network
  dio: ^5.6.0
  pretty_dio_logger: ^1.3.1
  socket_io_client: ^2.0.3+1

  # Firebase
  firebase_messaging: ^15.1.0
  firebase_core: ^3.6.0

  # UI Components
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  flutter_screenutil: ^5.9.3
  table_calendar: ^3.1.2
  
  # Animation & UI
  animate_do: ^3.3.4
  lottie: ^3.1.0
  page_transition: ^2.1.0
  shimmer: ^3.0.0
  loading_animation_widget: ^1.2.1
  flutter_slidable: ^3.0.0
  
  # Luxury Animation Libraries
  animations: ^2.0.11
  rive: ^0.13.1
  flutter_animate: ^4.5.0
  spring: ^2.0.2
  particles_network: ^1.9.4
  glassmorphism: ^3.0.0
  animated_background: ^2.0.0
  smooth_page_indicator: ^1.1.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  qr_code_scanner: ^1.0.1

  # Icons
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1

  # Camera
  camera: ^0.11.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
