[package]
name = "admin_tauri"
version = "1.0.0"
description = "AUTO_Renew Admin Desktop App"
authors = ["AUTO_Renew Team"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["devtools"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-http = "2.0.0"
reqwest = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
