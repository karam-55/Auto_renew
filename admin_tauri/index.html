<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AUTO_Renew - نظام إدارة مرآب السيارات المتكامل" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' ipc:; connect-src 'self' ipc: http://ipc.localhost http://localhost:* http://178.105.209.59:* https://*; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;" />
    <title>AUTO_Renew - نظام إدارة مرآب السيارات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.15);
      }
      .primary-gradient {
        background: linear-gradient(135deg, #003594 0%, #712ae2 100%);
      }
      .hover-lift {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .hover-lift:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px -10px rgba(27, 85, 208, 0.15);
      }
      .active-glow {
        box-shadow: 0 0 20px rgba(0, 74, 198, 0.3);
      }
      .primary-glow {
        box-shadow: 0 0 20px rgba(0, 74, 198, 0.3);
      }
      .animate-glow {
        animation: pulse-glow 2s infinite;
      }
      .page-enter {
        animation: page-enter 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .stagger-entry {
        opacity: 0;
        animation: fade-in-up 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes pulse-glow {
        0% { box-shadow: 0 0 0 0 rgba(0, 74, 198, 0.4); }
        70% { box-shadow: 0 0 0 15px rgba(0, 74, 198, 0); }
        100% { box-shadow: 0 0 0 0 rgba(0, 74, 198, 0); }
      }
      @keyframes pulse-red {
        0% { box-shadow: 0 0 0 0 rgba(186, 26, 26, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(186, 26, 26, 0); }
        100% { box-shadow: 0 0 0 0 rgba(186, 26, 26, 0); }
      }
      @keyframes page-enter {
        from { opacity: 0; transform: translateY(30px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes ambient-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .skeleton-shimmer {
        position: relative;
        overflow: hidden;
        background: #f1f5f9;
      }
      .skeleton-shimmer::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        animation: shimmer 1.5s infinite;
      }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 53, 148, 0.1); border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(0, 53, 148, 0.2); }
      @media (prefers-reduced-motion: reduce) {
        .page-enter, .stagger-entry, .hover-lift, .animate-glow, .glass-card:hover {
          animation: none !important;
          transition: none !important;
          transform: none !important;
          opacity: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
