name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Build TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 178.105.209.59 >> ~/.ssh/known_hosts

      - name: Update server .env with WhatsApp Business API (WhatChimp) vars
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            ${{ secrets.SERVER_USER }}@178.105.209.59 "
              ENV_FILE=/opt/auto-renew/deploy/.env
              if ! grep -q 'WATCHIMP_ENABLED' \$ENV_FILE 2>/dev/null; then
                echo '' >> \$ENV_FILE
                echo '# WhatsApp Business API (WhatChimp)' >> \$ENV_FILE
                echo 'WATCHIMP_ENABLED=true' >> \$ENV_FILE
                echo 'WATCHIMP_API_KEY=${{ secrets.WATCHIMP_API_KEY }}' >> \$ENV_FILE
                echo 'WATCHIMP_API_URL=https://app.whatchimp.com/api/v1' >> \$ENV_FILE
                echo 'WATCHIMP_PHONE_NUMBER_ID=${{ secrets.WATCHIMP_PHONE_NUMBER_ID }}' >> \$ENV_FILE
                echo 'WATCHIMP_BUSINESS_ACCOUNT_ID=${{ secrets.WATCHIMP_BUSINESS_ACCOUNT_ID }}' >> \$ENV_FILE
                echo 'BASE_URL=http://178.105.209.59' >> \$ENV_FILE
                echo 'Updated .env with WhatChimp vars'
              else
                echo 'WhatChimp vars already in .env'
              fi
            "

      - name: Copy backend source to server
        run: |
          rsync -avz --delete --exclude='node_modules' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            backend/ \
            ${{ secrets.SERVER_USER }}@178.105.209.59:/opt/auto-renew/backend/

      - name: Copy customer frontend to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            customer_frontend/ \
            ${{ secrets.SERVER_USER }}@178.105.209.59:/opt/auto-renew/customer_frontend/

      # WARNING: evolution_api (WhatsApp server) is NOT touched here.
      # It runs as a separate container and is managed independently.
      - name: Deploy backend on server
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            ${{ secrets.SERVER_USER }}@178.105.209.59 "
              cd /opt/auto-renew/deploy
              docker compose -f docker-compose.prod.yml build --no-cache backend
              docker compose -f docker-compose.prod.yml up -d backend
              docker compose -f docker-compose.prod.yml exec backend npx prisma db push --accept-data-loss --skip-generate
              sleep 5
              echo '=== Backend status ==='
              docker compose -f docker-compose.prod.yml ps backend
              echo '=== WhatsApp server (untouched) ==='
              docker ps --filter name=evolution_api --format '{{.Names}} {{.Status}}'
            "

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa
